<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>clic3d.tn — Parcours à valider</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#04B32B; --ink:#0f1f0f; --paper:#eef3ee; --line:#dde8dd; --muted:#78887a;
  --secu:#1a7bbf; --legal:#7b4fcf; --fisc:#c07000; --banque:#0a7d7d; --contrat:#b5347a; --auto:#5a6b5a;
  --ok:#04B32B; --q:#e08a00;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);
     line-height:1.45;padding-bottom:70px}

/* ── Barre haute ─────────────────────────── */
.top{position:sticky;top:0;z-index:30;background:rgba(238,243,238,.94);backdrop-filter:blur(8px);
     border-bottom:1.5px solid var(--line);padding:12px 20px 10px}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1500px;margin:0 auto}
h1{font-size:17px;font-weight:900;letter-spacing:-.3px;white-space:nowrap}
h1 .a{color:var(--brand)}
.sub{font-size:11.5px;color:var(--muted)}

.prog{display:flex;align-items:center;gap:10px;margin-left:auto}
.bar{width:190px;height:9px;border-radius:20px;background:#dfe8df;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.prog b{font-size:13px;font-weight:900;white-space:nowrap}

.btn{font-size:12px;font-weight:800;padding:8px 15px;border-radius:10px;border:1.5px solid var(--line);
     background:#fff;cursor:pointer;font-family:inherit;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.prim{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.prim:hover{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:focus-visible{outline:3px solid #9ad9ab;outline-offset:2px}

.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;max-width:1500px;margin:9px auto 0}
.flabel{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.chip{font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:20px;border:1.5px solid var(--line);
      background:#fff;cursor:pointer;font-family:inherit;color:#4a5a4a}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{color:#fff;border-color:transparent;background:var(--ink)}
.chip[data-k="secu"][aria-pressed="true"]{background:var(--secu)}
.chip[data-k="legal"][aria-pressed="true"]{background:var(--legal)}
.chip[data-k="fisc"][aria-pressed="true"]{background:var(--fisc)}
.chip[data-k="banque"][aria-pressed="true"]{background:var(--banque)}
.chip[data-k="contrat"][aria-pressed="true"]{background:var(--contrat)}
.chip[data-k="todo"][aria-pressed="true"]{background:#8a8a8a}
.zoom{display:flex;gap:5px;margin-left:auto;align-items:center}
.zbtn{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:#fff;cursor:pointer;
      font-size:14px;font-weight:900;color:#4a5a4a;font-family:inherit}
.zbtn:hover{border-color:var(--brand);color:var(--brand)}

/* ── Plateau ─────────────────────────────── */
#board{padding:22px 20px 40px;transform-origin:0 0;width:max-content;min-width:100%}
.lane{margin-bottom:26px}
.lane-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lane-badge{display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:12px;color:#fff}
.lane-badge .ic{font-size:17px}
.lane-badge .nm{font-size:13.5px;font-weight:900}
.lane-badge .wo{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.8}
.lane-prog{font-size:11.5px;font-weight:800;color:var(--muted)}
.lane-prog.done{color:var(--ok)}
.lane-line{flex:1;height:1.5px;background:var(--line)}

.rail{display:flex;align-items:flex-start;gap:0}

/* nœud */
.node{width:168px;flex-shrink:0;background:#fff;border:2px solid var(--line);border-radius:14px;
      padding:12px 12px 11px;cursor:pointer;position:relative;transition:.15s;text-align:left;
      font-family:inherit;color:inherit}
.node:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 5px 16px rgba(0,0,0,.07)}
.node:focus-visible{outline:3px solid #9ad9ab;outline-offset:2px}
.node.sel{border-color:var(--ink);box-shadow:0 0 0 3px rgba(15,31,15,.12)}
.node.ok{border-color:var(--ok);background:#f4fcf6}
.node.q{border-color:var(--q);background:#fffaf0}
.node.dim{opacity:.3;filter:grayscale(1)}
.node-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.node-n{width:22px;height:22px;border-radius:7px;background:#f0f4f0;display:flex;align-items:center;
        justify-content:center;font-size:11px;font-weight:900;flex-shrink:0}
.node.ok .node-n{background:var(--ok);color:#fff}
.node.q  .node-n{background:var(--q);color:#fff}
.node-ic{font-size:17px;margin-left:auto}
.node-t{font-size:12px;font-weight:800;line-height:1.3}
.node-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.tg{font-size:9px;font-weight:800;padding:2px 6px;border-radius:20px;color:#fff}
.t-secu{background:var(--secu)}.t-legal{background:var(--legal)}.t-fisc{background:var(--fisc)}
.t-banque{background:var(--banque)}.t-contrat{background:var(--contrat)}.t-auto{background:var(--auto)}
.node-state{position:absolute;top:-8px;right:-8px;width:21px;height:21px;border-radius:50%;
            display:none;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:900;
            border:2px solid #fff}
.node.ok .node-state{display:flex;background:var(--ok)}
.node.q .node-state{display:flex;background:var(--q)}

/* connecteur */
.conn{width:118px;flex-shrink:0;padding-top:34px;position:relative}
.conn-l{height:2px;background:#c3d2c3;position:relative}
.conn-l::after{content:'';position:absolute;right:-1px;top:-4px;border-left:8px solid #c3d2c3;
               border-top:5px solid transparent;border-bottom:5px solid transparent}
.conn-c{font-size:10px;font-style:italic;color:var(--muted);text-align:center;padding:0 5px 5px;line-height:1.35}

/* branches */
.branch{margin:14px 0 4px;padding:13px 15px;border:2px dashed var(--line);border-radius:14px;background:#fbfdfb;
        width:max-content;max-width:1100px}
.branch-t{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.branch-g{display:grid;gap:11px;position:relative;padding-top:42px;justify-content:start}
.bg-feed{position:absolute;top:0;left:50%;width:2px;height:20px;background:var(--ink);transform:translateX(-1px)}
.bg-bar{position:absolute;top:19px;height:3px;background:var(--ink)}
.bg-col{display:flex;flex-direction:column;align-items:center;position:relative}
.bg-stem{position:absolute;top:-20px;left:50%;width:2px;height:20px;background:var(--ink);transform:translateX(-1px)}
.bg-tr{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;margin-bottom:7px}
.bg-tr-bar{width:46px;height:3px;background:var(--ink)}
.bg-tr-c{font-size:10.5px;font-style:italic;color:#4a5a4a;text-align:center;line-height:1.3}
.bg-tr-c b{font-style:normal;font-weight:900;color:var(--ink);font-size:9.5px;letter-spacing:.4px;
           background:#eef3ee;border-radius:5px;padding:1px 5px;margin-right:3px}
.bg-tail{display:flex;flex-direction:column;align-items:center}
.bg-tail-l{width:2px;height:12px;background:var(--ink)}
.br{width:236px;border:1.5px solid var(--line);border-radius:11px;background:#fff;padding:11px 13px;
     display:block;text-align:left;font-family:inherit;color:inherit}
.br-c{font-size:10.5px;font-style:italic;color:var(--muted);margin-bottom:4px}
.br-o{font-size:12.5px;font-weight:900}
.br-d{font-size:11px;color:#4a5a4a;margin-top:4px;line-height:1.4}
.br-if{font-style:normal;font-weight:900;color:var(--ink);letter-spacing:.5px;font-size:10px;
       background:#eef3ee;border-radius:5px;padding:1px 6px;margin-right:4px}
.br-link{cursor:pointer;font-family:inherit;text-align:left;color:inherit;border-color:#c3d2c3;transition:.15s}
.br-link:hover{border-color:var(--brand);background:#f4fbf6;transform:translateY(-2px);box-shadow:0 5px 14px rgba(0,0,0,.07)}
.br-link:focus-visible{outline:3px solid #9ad9ab;outline-offset:2px}
.br-cta{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--brand);text-align:center;max-width:236px}
.br-end{border-width:2px;border-color:var(--ink);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.br-final{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}

/* ── Panneau ─────────────────────────────── */
#ov{position:fixed;inset:0;background:rgba(15,31,15,.35);z-index:40;display:none}
#ov.o{display:block}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:50;
       border-left:1.5px solid var(--line);display:none;flex-direction:column;box-shadow:-8px 0 34px rgba(0,0,0,.16)}
#panel.o{display:flex}
.p-head{padding:16px 20px 13px;border-bottom:1.5px solid var(--line)}
.p-kicker{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.p-title{font-size:18px;font-weight:900;margin-top:4px;line-height:1.25;padding-right:26px}
.p-close{position:absolute;top:13px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;
         color:var(--muted);font-weight:700;line-height:1}
.p-body{flex:1;overflow-y:auto;padding:18px 20px}
.p-d{font-size:13.5px;color:#3d4d3d}
.p-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.p-note{margin-top:14px;font-size:12.5px;color:#8a5c00;background:#fff8e9;border-left:3px solid var(--fisc);
        padding:10px 12px;border-radius:9px;font-weight:600}
.p-cond{margin-top:14px;font-size:12px;color:var(--muted);font-style:italic}
.p-sec{margin-top:20px;padding-top:16px;border-top:1.5px solid var(--line)}
.p-lab{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
textarea{width:100%;min-height:74px;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;
         font-family:inherit;font-size:12.5px;resize:vertical;color:inherit}
textarea:focus{outline:none;border-color:var(--brand)}
.p-foot{border-top:1.5px solid var(--line);padding:13px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.act{flex:1;min-width:96px;font-size:12.5px;font-weight:800;padding:11px 10px;border-radius:11px;border:2px solid;
     cursor:pointer;font-family:inherit;background:#fff}
.act.v{border-color:var(--ok);color:var(--ok)} .act.v:hover,.act.v.on{background:var(--ok);color:#fff}
.act.q{border-color:var(--q);color:var(--q)}  .act.q:hover,.act.q.on{background:var(--q);color:#fff}
.act.r{border-color:var(--line);color:var(--muted)} .act.r:hover{border-color:#b33;color:#b33}
.nav{display:flex;gap:8px;width:100%}
.nav .btn{flex:1;text-align:center}
.kbd{font-size:10.5px;color:var(--muted);width:100%;text-align:center;margin-top:2px}
.kbd b{background:#f0f4f0;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-weight:800}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);
       color:#fff;font-size:12.5px;font-weight:700;padding:11px 20px;border-radius:11px;z-index:60;
       transition:transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.o{transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  .prog{width:100%;margin-left:0}
  .node{width:150px}
  .conn{width:82px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .top,#panel,#ov{display:none!important}
  body{background:#fff}
  #board{transform:none!important}
}
</style>
</head>
<body>

<div class="top">
  <div class="top-row">
    <h1>clic<span class="a">3d</span>.tn <span style="font-weight:600;font-size:13px">— parcours à valider</span></h1>
    <span class="sub">Clique une étape pour l'examiner et la valider.</span>
    <div class="prog">
      <div class="bar"><i id="pbar"></i></div>
      <b id="ptxt">0 / 0</b>
      <button class="btn prim" id="review">▶ Tout parcourir</button>
      <button class="btn" id="report">Rapport</button>
    </div>
  </div>
  <div class="chips">
    <span class="flabel">Filtrer</span>
    <button class="chip" data-k="all" aria-pressed="true">Tout</button>
    <button class="chip" data-k="secu">🔒 Sécurité</button>
    <button class="chip" data-k="legal">⚖️ Légal</button>
    <button class="chip" data-k="fisc">🧾 Fiscal</button>
    <button class="chip" data-k="banque">🏦 Bancaire</button>
    <button class="chip" data-k="contrat">📄 Contrat</button>
    <button class="chip" data-k="todo">⏳ Reste à valider</button>
    <span class="zoom">
      <button class="zbtn" id="zout" title="Dézoomer">−</button>
      <button class="zbtn" id="zrst" title="Taille réelle" style="width:auto;padding:0 10px;font-size:11px">100%</button>
      <button class="zbtn" id="zin" title="Zoomer">+</button>
    </span>
  </div>
</div>

<div id="board"></div>

<div id="ov"></div>
<aside id="panel" aria-label="Détail de l'étape">
  <div class="p-head">
    <button class="p-close" id="pclose" aria-label="Fermer">×</button>
    <div class="p-kicker" id="pk"></div>
    <div class="p-title" id="pt"></div>
  </div>
  <div class="p-body">
    <div class="p-cond" id="pc"></div>
    <div class="p-d" id="pd"></div>
    <div class="p-tags" id="pg"></div>
    <div class="p-note" id="pn" style="display:none"></div>
    <div class="p-sec">
      <div class="p-lab">Remarque, question, correction à apporter</div>
      <textarea id="pcom" placeholder="Ce que tu veux changer ou faire vérifier…"></textarea>
    </div>
  </div>
  <div class="p-foot">
    <button class="act v" id="av">✓ Valider</button>
    <button class="act q" id="aq">? À revoir</button>
    <button class="act r" id="ar">↺ Effacer</button>
    <div class="nav">
      <button class="btn" id="prev">← Précédente</button>
      <button class="btn prim" id="next">Suivante →</button>
    </div>
    <div class="kbd"><b>←</b> <b>→</b> naviguer · <b>V</b> valider · <b>Q</b> à revoir · <b>Échap</b> fermer</div>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
const TAGL={secu:'🔒 Sécurité',legal:'⚖️ Légal',fisc:'🧾 Fiscal',banque:'🏦 Bancaire',contrat:'📄 Contrat',auto:'auto'};

const J=[
 {id:'compte',ic:'👤',nm:'Créer son compte',wo:'Client',color:'#1a7bbf',steps:[
  {s:"Arrivée sur clic3d.tn",ic:'🌐',d:"Depuis une recherche, le groupe Facebook ou un lien direct.",tag:[],n:""},
  {s:"Création du compte",ic:'✍️',d:"Email et mot de passe, ou Google, ou Facebook. Un seul compte par personne.",tag:['legal'],n:"Aucun achat anonyme : toute commande est rattachée à un compte nominatif.",tt:"le visiteur veut acheter"},
  {s:"Vérification de l'adresse",ic:'📧',d:"Un code est envoyé par e-mail et doit être saisi. Le compte n'est actif qu'ensuite.",tag:['secu'],n:"",tt:"identifiants fournis"},
  {s:"Complément de profil",ic:'📇',d:"Nom et téléphone au format international. Le pays est détecté automatiquement.",tag:['auto'],n:"",tt:"compte vérifié"},
  {s:"Aucune carte à enregistrer",ic:'🔒',d:"La plateforme ne stocke aucune donnée de carte. Le numéro est saisi à chaque achat, sur la page sécurisée du prestataire de paiement, avec authentification 3-D Secure.",tag:['secu','banque'],n:"Point de contrôle : c'est ce qui dispense la plateforme de toute exigence de conservation de données de carte.",tt:"profil complet"}],branches:[]},

 {id:'stl',ic:'📁',nm:'Acheter un fichier STL',wo:'Client',color:'#7b4fcf',steps:[
  {s:"Choix du fichier",ic:'🔍',d:"L'acheteur parcourt le catalogue et ouvre une fiche produit.",tag:[],n:""},
  {s:"Choix de la licence",ic:'⚖️',d:"Personnelle — impression pour soi. Commerciale — droit de vendre les objets imprimés. Dans les deux cas, le fichier lui-même n'est jamais revendable.",tag:['legal'],n:"Deux prix distincts pour le même fichier. La licence choisie est portée sur la facture.",tt:"fichier retenu"},
  {s:"Récapitulatif avant paiement",ic:'🧾',d:"Prix TTC, licence, et frais de service de 15 % affichés distinctement, avec la mention qu'ils ne sont pas remboursables.",tag:['legal','fisc'],n:"Point de contrôle : une retenue découverte au moment du remboursement serait contestable. Elle est annoncée avant.",tt:"licence choisie"},
  {s:"Paiement sur la page du prestataire",ic:'💳',d:"Redirection vers la passerelle, saisie de la carte, authentification 3-D Secure. La plateforme ne voit jamais le numéro.",tag:['secu','banque'],n:"",tt:"l'acheteur confirme"},
  {s:"Vérification serveur à serveur",ic:'🛡️',d:"La plateforme ne se fie pas au retour du navigateur : elle interroge le prestataire pour confirmer le montant et l'état réel de la transaction.",tag:['secu','auto'],n:"Point de contrôle : sans cette vérification, une commande pourrait être validée sans paiement réel.",tt:"paiement autorisé par la banque"},
  {s:"Mise à disposition du fichier",ic:'⬇️',d:"Téléchargement immédiat depuis l'espace client, accompagné de la fiche des conditions d'utilisation correspondant à la licence achetée. Chaque téléchargement est journalisé.",tag:['auto','legal'],n:"Le fichier ne part jamais seul : la licence qui l'accompagne dit ce que l'acheteur a le droit d'en faire.",tt:"paiement confirmé"},
  {s:"Reçu, notification et facture",ic:'📄',d:"Le reçu rappelle à l'acheteur l'usage autorisé, les limites de sa licence et la garantie. Le designer reçoit une notification de vente et voit le montant dû s'inscrire à son tableau des ventes. La facture est émise dès qu'il la demande.",tag:['fisc','auto'],n:"",tt:"fichier délivré"}],
  branches:[{after:6,title:"Après téléchargement",items:[
   {c:"fichier conforme",o:"Aucune rétractation",d:"Le droit de rétractation ne s'applique plus : l'acheteur y a renoncé expressément avant de télécharger."},
   {c:"non conforme aux images, ou défaut technique",o:"Réclamation ouverte",d:"Un ticket est ouvert et la plateforme examine le fichier.",go:'litige-stl'}]}]},

 {id:'custom',ic:'🛠️',nm:'Commander un custom gig',wo:'Client',color:'#0a7d7d',steps:[
  {s:"Publication d'une demande",ic:'📢',d:"Gratuit, et volontairement court : le besoin, le gouvernorat, le budget approximatif. Une demande peut aussi arriver du groupe Facebook, remontée par le bot Messenger.",tag:[],n:"Le formulaire doit rester simple : c'est un formulaire que le bot devra pouvoir remplir à la place du demandeur."},
  {s:"Discussion dans la messagerie",ic:'💬',d:"Plusieurs makers peuvent répondre : autant de conversations et d'offres menées en parallèle. Tout l'échange reste sur la plateforme et y est conservé.",tag:['legal'],n:"Le maker n'est choisi qu'au moment du paiement : c'est le bouton de paiement qui tranche, pas un choix déclaré à l'avance.",tt:"des makers la consultent"},
  {s:"Réception d'une offre à prix fixe",ic:'📝',d:"Le maker chiffre : description, images, matériau, dimensions, délai, prix. Le délai ne peut dépasser 90 jours ou 12 semaines.",tag:['contrat'],n:"",tt:"le besoin est cerné"},
  {s:"Gel de l'offre et contrat",ic:'🔐',d:"À l'acceptation, l'offre devient non modifiable et est horodatée. Un contrat reprenant les droits de chacun est établi et envoyé automatiquement au maker et au demandeur.",tag:['contrat','secu','auto'],n:"Sans ce gel, un maker pourrait modifier son annonce après coup et l'arbitrage n'aurait plus de référence.",tt:"l'acheteur accepte"},
  {s:"Paiement intégral sur la plateforme",ic:'💳',d:"100 % du prix. C'est ce qui rend la garantie possible : l'argent est détenu jusqu'à la validation.",tag:['banque','fisc'],n:"",tt:"offre figée"},

/* ── état persistant ── */
const KEY='clic3d-parcours-validation-v1';
let ST = {};
try{ ST = JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ ST={}; }
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} };

/* index à plat pour la navigation */
const FLAT=[];
J.forEach((j,ji)=>j.steps.forEach((s,si)=>FLAT.push({ji,si,key:j.id+'-'+si})));

let filter='all', cur=-1, zoom=1;

/* ── construction du plateau ── */
function build(){
  document.getElementById('board').innerHTML = J.map((j,ji)=>{
    const rail = j.steps.map((s,si)=>{
      const conn = si ? `<div class="conn"><div class="conn-c">${s.tt||''}</div><div class="conn-l"></div></div>` : '';
      return conn + `<button class="node" type="button" data-j="${ji}" data-s="${si}" id="n-${ji}-${si}">
          <span class="node-state"></span>
          <div class="node-top"><span class="node-n">${si+1}</span><span class="node-ic">${s.ic}</span></div>
          <div class="node-t">${s.s}</div>
          ${s.tag.length?`<div class="node-tags">${s.tag.map(t=>`<span class="tg t-${t}">${t==='auto'?'auto':TAGL[t].split(' ')[1]}</span>`).join('')}</div>`:''}
        </button>`;
    }).join('');
    const GAP=11;                        // identique au gap CSS de .branch-g
    const branches = (j.branches||[]).map(b=>{
      const n=b.items.length;
      const half=`calc((100% - ${(n-1)*GAP}px) / ${2*n})`;
      return `<div class="branch">
        <div class="branch-t">${b.title}</div>
        <div class="branch-g" style="grid-template-columns:repeat(${n},236px)">
          <span class="bg-feed"></span>
          <span class="bg-bar" style="left:${half};right:${half}"></span>
          ${b.items.map((i,k)=>{
            const mot = n===1 ? 'SI' : (k===0 ? 'SI' : (k===n-1 ? 'SINON' : 'SINON SI'));
            const term = i.next===undefined && !i.go;
            const head = `<span class="bg-stem"></span>
              <div class="bg-tr"><span class="bg-tr-bar"></span><span class="bg-tr-c"><b>${mot}</b> ${i.c}</span></div>`;
            const body = `<div class="br-o">${i.o}</div><div class="br-d">${i.d}</div>`;
            const tail = term
              ? `<div class="bg-tail"><span class="bg-tail-l"></span><span class="br-final">▣ état final</span></div>`
              : `<div class="bg-tail"><span class="bg-tail-l"></span><span class="br-cta">${
                  i.next!==undefined ? '↓ étape '+(i.next+1)+' — '+j.steps[i.next].s : '→ ouvrir le parcours'}</span></div>`;
            const box = term
              ? `<div class="br br-end">${body}</div>`
              : `<button class="br br-link" type="button" ${i.go?`data-go="${i.go}"`:`data-j="${ji}" data-s="${i.next}"`}>${body}</button>`;
            return `<div class="bg-col">${head}${box}${tail}</div>`;
          }).join('')}
        </div>
      </div>`;}).join('');
    return `<section class="lane" data-lane="${ji}">
        <div class="lane-head">
          <div class="lane-badge" style="background:${j.color}">
            <span class="ic">${j.ic}</span>
            <span><span class="nm">${j.nm}</span><br><span class="wo">${j.wo} · ${j.steps.length} étapes</span></span>
          </div>
          <span class="lane-prog" id="lp-${ji}"></span>
          <span class="lane-line"></span>
        </div>
        <div class="rail">${rail}</div>
        ${branches}
      </section>`;
  }).join('');

  document.querySelectorAll('.node').forEach(n=>{
    n.onclick=()=>open_(+n.dataset.j, +n.dataset.s);
  });
  document.querySelectorAll('.br-link').forEach(bt=>{
    bt.onclick=()=>{
      if(bt.dataset.go){
        const ji=J.findIndex(x=>x.id===bt.dataset.go);
        if(ji<0) return;
        document.querySelector(`[data-lane="${ji}"]`).scrollIntoView({behavior:'smooth',block:'start'});
        setTimeout(()=>open_(ji,0),380);
      } else {
        open_(+bt.dataset.j, +bt.dataset.s);
      }
    };
  });
  refresh();
}

/* ── états visuels + compteurs ── */
function refresh(){
  let ok=0,q=0;
  J.forEach((j,ji)=>{
    let lok=0;
    j.steps.forEach((s,si)=>{
      const st=ST[j.id+'-'+si], n=document.getElementById(`n-${ji}-${si}`);
      n.classList.toggle('ok', st?.v==='ok');
      n.classList.toggle('q',  st?.v==='q');
      n.querySelector('.node-state').textContent = st?.v==='ok'?'✓':(st?.v==='q'?'?':'');
      if(st?.v==='ok'){ok++;lok++;}
      if(st?.v==='q') q++;
      const dim = filter!=='all' && (filter==='todo' ? !!st?.v : !s.tag.includes(filter));
      n.classList.toggle('dim', dim);
    });
    const el=document.getElementById('lp-'+ji);
    el.textContent = lok+' / '+j.steps.length+' validées';
    el.classList.toggle('done', lok===j.steps.length);
  });
  const tot=FLAT.length;
  document.getElementById('pbar').style.width = (ok/tot*100)+'%';
  document.getElementById('ptxt').textContent = ok+' / '+tot+(q?'  ·  '+q+' à revoir':'');
}

/* ── panneau ── */
const P=id=>document.getElementById(id);
function open_(ji,si){
  cur = FLAT.findIndex(f=>f.ji===ji&&f.si===si);
  const j=J[ji], s=j.steps[si], st=ST[j.id+'-'+si]||{};
  P('pk').textContent = `${j.ic} ${j.nm} — étape ${si+1} sur ${j.steps.length}`;
  P('pt').textContent = s.s;
  P('pc').innerHTML = s.tt ? `Condition d'entrée : ${s.tt}` : '';
  P('pd').textContent = s.d;
  P('pg').innerHTML = s.tag.map(t=>`<span class="tg t-${t}">${TAGL[t]}</span>`).join('');
  P('pn').style.display = s.n?'block':'none'; P('pn').textContent = s.n||'';
  P('pcom').value = st.c||'';
  P('av').classList.toggle('on', st.v==='ok');
  P('aq').classList.toggle('on', st.v==='q');
  P('panel').classList.add('o'); P('ov').classList.add('o');
  document.querySelectorAll('.node.sel').forEach(n=>n.classList.remove('sel'));
  const n=document.getElementById(`n-${ji}-${si}`);
  n.classList.add('sel'); n.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}
function close_(){ P('panel').classList.remove('o'); P('ov').classList.remove('o');
  document.querySelectorAll('.node.sel').forEach(n=>n.classList.remove('sel')); cur=-1; }

function setState(v){
  if(cur<0) return;
  const f=FLAT[cur];
  ST[f.key] = Object.assign({}, ST[f.key], {v, c:P('pcom').value.trim()||undefined});
  if(!v) delete ST[f.key];
  save(); refresh();
  P('av').classList.toggle('on', v==='ok'); P('aq').classList.toggle('on', v==='q');
  toast(v==='ok'?'Étape validée':(v==='q'?'Marquée à revoir':'Remise à zéro'));
  if(v) setTimeout(()=>go(1), 260);
}
function go(d){
  if(cur<0) return;
  const t=cur+d;
  if(t<0||t>=FLAT.length){ close_(); toast(t>=FLAT.length?'Fin du parcours — tout a été passé en revue':'Début du parcours'); return; }
  open_(FLAT[t].ji, FLAT[t].si);
}
let tmr;
function toast(m){ const t=P('toast'); t.textContent=m; t.classList.add('o');
  clearTimeout(tmr); tmr=setTimeout(()=>t.classList.remove('o'),1700); }

/* commentaire sauvegardé à la volée */
P('pcom').addEventListener('input',()=>{
  if(cur<0) return; const f=FLAT[cur];
  const c=P('pcom').value.trim();
  ST[f.key]=Object.assign({},ST[f.key],{c:c||undefined});
  if(!ST[f.key].v && !c) delete ST[f.key];
  save();
});

P('av').onclick=()=>setState('ok');
P('aq').onclick=()=>setState('q');
P('ar').onclick=()=>{ if(cur<0)return; delete ST[FLAT[cur].key]; P('pcom').value=''; save(); refresh();
  P('av').classList.remove('on'); P('aq').classList.remove('on'); toast('Remise à zéro'); };
P('prev').onclick=()=>go(-1);
P('next').onclick=()=>go(1);
P('pclose').onclick=close_;
P('ov').onclick=close_;

document.getElementById('review').onclick=()=>{
  const first = FLAT.findIndex(f=>!ST[f.key]?.v);
  const i = first<0?0:first;
  open_(FLAT[i].ji, FLAT[i].si);
  toast(first<0?'Tout est déjà passé en revue — reprise au début':'Reprise à la première étape non validée');
};

document.getElementById('report').onclick=()=>{
  const L=['# Revue des parcours clic3d.tn',''];
  let ok=0,q=0,todo=0;
  J.forEach(j=>{
    const rows=j.steps.map((s,si)=>{
      const st=ST[j.id+'-'+si]||{};
      if(st.v==='ok')ok++; else if(st.v==='q')q++; else todo++;
      const m = st.v==='ok'?'[x]':(st.v==='q'?'[?]':'[ ]');
      return `- ${m} ${si+1}. ${s.s}${st.c?`\n      → ${st.c}`:''}`;
    });
    L.push(`## ${j.nm} (${j.wo})`, ...rows, '');
  });
  L.splice(1,0,`${ok} validées · ${q} à revoir · ${todo} non examinées`,'');
  const txt=L.join('\n');
  navigator.clipboard?.writeText(txt).then(()=>toast('Rapport copié dans le presse-papiers'),
    ()=>{ const w=window.open(); w.document.write('<pre>'+txt.replace(/</g,'&lt;')+'</pre>'); });
};

document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  filter=c.dataset.k;
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed', x.dataset.k===filter));
  refresh();
});

/* zoom */
const setZoom=z=>{ zoom=Math.min(1.4,Math.max(.5,z));
  const b=document.getElementById('board');
  b.style.transform='scale('+zoom+')';
  b.style.width = zoom<1 ? (100/zoom)+'%' : 'max-content';
  document.getElementById('zrst').textContent=Math.round(zoom*100)+'%'; };
document.getElementById('zin').onclick=()=>setZoom(zoom+.1);
document.getElementById('zout').onclick=()=>setZoom(zoom-.1);
document.getElementById('zrst').onclick=()=>setZoom(1);

document.addEventListener('keydown',e=>{
  if(!P('panel').classList.contains('o')) return;
  if(e.target.tagName==='TEXTAREA'){ if(e.key==='Escape') e.target.blur(); return; }
  if(e.key==='Escape') close_();
  else if(e.key==='ArrowRight') go(1);
  else if(e.key==='ArrowLeft') go(-1);
  else if(e.key==='v'||e.key==='V') setState('ok');
  else if(e.key==='q'||e.key==='Q') setState('q');
});

build();
</script>
</body>
</html>
